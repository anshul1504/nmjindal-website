{% load static %}
<div class="row g-4">
  <div class="col-12 reveal">
    <figure class="freight-card wide">
      <img src="{% static 'core/img/photos/sea-freight.jpg' %}" alt="Aerial view of a container ship at sea" loading="lazy" width="1600" height="760">
      <figcaption><i class="bi bi-water"></i> Sea Freight<small>Bulk and containerised cargo across oceans</small></figcaption>
    </figure>
  </div>
  <div class="col-md-6 reveal d1">
    <figure class="freight-card">
      <img src="{% static 'core/img/photos/air-freight.jpg' %}" alt="Aircraft being loaded with cargo at night" loading="lazy" width="1200" height="800">
      <figcaption><i class="bi bi-airplane"></i> Air Freight<small>When speed matters most</small></figcaption>
    </figure>
  </div>
  <div class="col-md-6 reveal d2">
    <figure class="freight-card">
      <img src="{% static 'core/img/photos/land-freight.jpg' %}" alt="Freight trucks on the highway" loading="lazy" width="1200" height="800">
      <figcaption><i class="bi bi-truck"></i> Land Freight<small>Port-to-door delivery</small></figcaption>
    </figure>
  </div>
</div>
